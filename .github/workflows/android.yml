name: Build and release

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: set up JDK 17
      uses: actions/setup-java@v1
      with:
        java-version: '17'
    - name: Build with Gradle
      run: |
        ./gradlew assembleDebug
        cp /home/runner/work/android_packages_apps_RickyWeather/android_packages_apps_RickyWeather/app/build/outputs/apk/release/*.apk RickyWeather.apk
        pwd > file_list.txt
        ls -lR >> file_list.txt

    - name: Upload .apk
      uses: actions/upload-artifact@v4
      with:
        name: RickyWeather
        path: RickyWeather.apk

  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Release
        uses: fnkr/github-action-ghr@v1.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHR_PATH: RickyWeather.apk
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

